            { title: "Adorn — Gold Visor",      eyebrow: "Drop 002", link: "adorn.html" },
            { title: "The Predator Cybermask", eyebrow: "Drop 001", link: "predator.html" },
            { title: "Adorn — Jade Visor",      eyebrow: "Drop 002", link: "adorn.html" }
        ];

        var slides = document.querySelectorAll('.cinema-slide');
        var dots = document.querySelectorAll('.cine-dot');
        var titleEl = document.getElementById('productTitle');
        var eyebrowEl = document.getElementById('dropEyebrow');
        var shopBtn = document.getElementById('shopNowBtn');
        var contentEl = document.getElementById('cinemaContent');
        var current = 0;
        var timer;

        contentEl.style.transition = 'opacity 0.3s ease';

        function render(index) {
            slides.forEach(function(s) { s.classList.remove('active'); });
            dots.forEach(function(d) { d.classList.remove('active'); });
            slides[index].classList.add('active');
            dots[index].classList.add('active');

            contentEl.style.opacity = '0';
            setTimeout(function() {
                titleEl.textContent = slidesData[index].title;
                eyebrowEl.textContent = slidesData[index].eyebrow;
                shopBtn.href = slidesData[index].link;
                contentEl.style.opacity = '1';
            }, 250);

            current = index;
        }

        dots.forEach(function(dot) {
            dot.addEventListener('click', function() {
                render(parseInt(dot.getAttribute('data-index'), 10));
                resetTimer();
            });
        });

        function resetTimer() {
            clearInterval(timer);
            timer = setInterval(function() {
                render((current + 1) % slides.length);
            }, 6000);
        }
        resetTimer();

        var hamburger = document.getElementById('navHamburger');
        var drawer = document.getElementById('mobileNavDrawer');
        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('open');
            drawer.classList.toggle('open');
        });
    });
    </script>

</body>
</html>
